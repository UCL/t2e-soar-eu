[project]
name = "t2esoareu"
version = "2.0.0"
description = "SOAR-EU: Scalable Open Automatable Reproducible pedestrian-scale urban metrics for 626 European urban centres"
readme = "README.md"
requires-python = ">=3.12, <3.14"
license = { text = "AGPL-3.0" }
authors = [{ name = "Gareth Simons", email = "gareth.simons@ucl.ac.uk" }]
dependencies = [
  "geopandas>=1.1.1",
  "networkx>=3.1",
  "pandas>=2.3.2",
  "shapely>=2.1.1",
  "tqdm>=4.65.0",
  "pyproj>=3.6.1",
  "cityseer>=5.8.0",
  "rasterio>=1.4.3",
  "momepy>=0.10.0",
  "matplotlib>=3.8.0",
  "osmnx>=2.0.6",
  "fiona>=1.9.5",
  "scipy>=1.11.3",
  "seaborn>=0.13.2",
  "overturemaps>=0.19.0",
  "fastcluster>=1.3.0",
  "fastparquet>=2025.12.0",
  "pyarrow>=22.0.0",
  "unidecode>=1.4.0",
  "esda>=2.8.1",
  "libpysal>=4.14.0",
  "statsmodels>=0.14.6",
  "jenkspy>=0.4.1",
  "scikit-learn>=1.8.0",
  "awscli>=1.44.46",
  "umap-learn>=0.5.11",
  "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pyright>=1.1.380", "pytest>=7.4.0", "ruff>=0.5.1"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
